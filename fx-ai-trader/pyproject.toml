[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxai"
version = "1.0.0"
description = "AI-assisted, risk-first autonomous FX trading system for MetaTrader 4 (demo-first)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary - see README" }

[tool.setuptools.packages.find]
include = ["fxai*"]

[tool.setuptools.package-data]
"fxai.dashboard" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "realdata: tests that need the downloaded historical dataset (skipped if absent)",
]
